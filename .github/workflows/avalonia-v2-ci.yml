name: Avalonia v2 CI

on:
  push:
    branches:
      - main
      - rewrite/avalonia-v2
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repository security gate
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $baseSha = if ($env:EVENT_NAME -eq 'pull_request') { $env:PR_BASE_SHA } else { $env:EVENT_BEFORE }
          ./.github/scripts/security-gate.ps1 -BaseSha $baseSha

  build:
    name: Build and Audit
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate localization packs
        shell: pwsh
        run: ./Scripts/Validate-Localization.ps1

      - name: Restore
        run: dotnet restore VpsDesk.slnx

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $output = dotnet list VpsDesk.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -match '(?im)^\s*>\s+\S+\s+\S+\s+\S+\s+(?:Low|Moderate|High|Critical)\b') {
            Write-Error 'Vulnerable NuGet package detected. Update or explicitly review the dependency before merging.'
            exit 1
          }

      - name: Build
        run: dotnet build VpsDesk.slnx --configuration Release --no-restore

      - name: Desktop startup smoke test
        shell: bash
        run: |
          set +e
          timeout 5s xvfb-run -a dotnet src/VpsDesk.Desktop/bin/Release/net10.0/VpsDesk.Desktop.dll
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Desktop process exited unexpectedly with code $code"
            exit "$code"
          fi

      - name: Publish Windows x64 test build
        if: github.event_name == 'push'
        run: >-
          dotnet publish src/VpsDesk.Desktop/VpsDesk.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/VPS-Desk-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload Windows x64 test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: VPS-Desk-win-x64
          path: artifacts/VPS-Desk-win-x64/
          if-no-files-found: error
          retention-days: 14
