name: Avalonia v2 CI

on:
  push:
    branches:
      - rewrite/avalonia-v2
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'VpsDesk.slnx'
      - '.github/workflows/avalonia-v2-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VpsDesk.slnx

      - name: Build
        run: dotnet build VpsDesk.slnx --configuration Release --no-restore
