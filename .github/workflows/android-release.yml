name: Android Release (Netlify)

# Compila y firma el APK y lo publica en el sitio privado de Netlify junto con version.json.
# La app instalada consulta ese version.json y ofrece instalar la actualización.
# Cada push a main publica una versión; también se puede ejecutar a mano.
# El APK NO se sube como artifact: el repositorio es público y los artifacts también lo serían.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: Notas de la versión (se muestran en la app)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  android:
    name: Build, sign and publish APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate interface resources
        run: |
          python3 Scripts/Validate-UiTokens.py
          python3 -m unittest discover -s Scripts/tests -p test_android_release_version.py

      - name: Allocate a new version
        id: release_version
        env:
          UPDATE_BASE_URL: ${{ secrets.ANDROID_UPDATE_URL }}
        run: |
          test -n "$UPDATE_BASE_URL" || { echo "::error::Falta el secret ANDROID_UPDATE_URL"; exit 1; }
          python3 Scripts/android_release_version.py prepare \
            --manifest "${UPDATE_BASE_URL%/}/version.json" \
            --project src/VpsDesk.Android/VpsDesk.Android.csproj --output "$GITHUB_OUTPUT"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vpsdesk.keystore"

      - name: Build signed APK
        env:
          UPDATE_BASE_URL: ${{ secrets.ANDROID_UPDATE_URL }}
          VPSDESK_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VPSDESK_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_CODE: ${{ steps.release_version.outputs.code }}
          RELEASE_NAME: ${{ steps.release_version.outputs.name }}
        run: |
          test -n "$UPDATE_BASE_URL" || { echo "::error::Falta el secret ANDROID_UPDATE_URL"; exit 1; }
          dotnet publish src/VpsDesk.Android/VpsDesk.Android.csproj \
            --configuration Release \
            -p:RuntimeIdentifier=android-arm64 \
            "-p:ApplicationVersion=$RELEASE_CODE" \
            "-p:ApplicationDisplayVersion=$RELEASE_NAME" \
            "-p:VpsDeskUpdateUrl=${UPDATE_BASE_URL%/}/version.json" \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/vpsdesk.keystore" \
            "-p:AndroidSigningKeyAlias=${KEY_ALIAS:-vpsdesk}" \
            -p:AndroidSigningKeyPass=env:VPSDESK_KEY_PASS \
            -p:AndroidSigningStorePass=env:VPSDESK_KEYSTORE_PASS

      - name: Prepare site (APK + version.json)
        shell: pwsh
        env:
          NOTES: ${{ inputs.notes }}
          RELEASE_CODE: ${{ steps.release_version.outputs.code }}
          RELEASE_NAME: ${{ steps.release_version.outputs.name }}
        run: |
          $apk = Get-ChildItem src/VpsDesk.Android/bin/Release -Recurse -Filter '*-Signed.apk' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { throw 'No se encontró el APK firmado.' }

          $versionCode = [int]$env:RELEASE_CODE
          $versionName = $env:RELEASE_NAME

          New-Item -ItemType Directory -Path site | Out-Null
          $apkName = "vpsdesk-$versionCode.apk"
          Copy-Item $apk.FullName "site/$apkName"
          $sha = (Get-FileHash "site/$apkName" -Algorithm SHA256).Hash

          [ordered]@{
            versionCode = $versionCode
            versionName = $versionName
            apkUrl      = $apkName
            sha256      = $sha
            notes       = $env:NOTES
          } | ConvertTo-Json | Set-Content site/version.json -Encoding utf8

          "/version.json`n  Cache-Control: no-cache`n/*`n  X-Robots-Tag: noindex, nofollow" | Set-Content site/_headers -Encoding ascii
          "User-agent: *`nDisallow: /" | Set-Content site/robots.txt -Encoding ascii
          "versionCode=$versionCode versionName=$versionName apk=$([math]::Round($apk.Length/1MB,1)) MB sha256=$sha"

      - name: Verify package and publication preconditions
        env:
          UPDATE_BASE_URL: ${{ secrets.ANDROID_UPDATE_URL }}
          RELEASE_CODE: ${{ steps.release_version.outputs.code }}
          RELEASE_NAME: ${{ steps.release_version.outputs.name }}
          CHANNEL_DIGEST: ${{ steps.release_version.outputs.channel_digest }}
        run: |
          set -euo pipefail
          apk="site/vpsdesk-$RELEASE_CODE.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify "$apk"
          package_info="$("$build_tools/aapt" dump badging "$apk" | sed -n '1p')"
          [[ "$package_info" == *"versionCode='$RELEASE_CODE'"* && "$package_info" == *"versionName='$RELEASE_NAME'"* ]] || { echo '::error::El APK no corresponde a la versión preparada.'; exit 1; }
          head_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$head_sha" = "$GITHUB_SHA" || { echo '::error::Hay un commit más reciente en main; esta publicación queda cancelada.'; exit 1; }
          python3 Scripts/android_release_version.py check \
            --manifest "${UPDATE_BASE_URL%/}/version.json" --code "$RELEASE_CODE" --digest "$CHANNEL_DIGEST"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "::error::Falta el secret NETLIFY_AUTH_TOKEN"; exit 1; }
          npx --yes netlify-cli@27.17.0 deploy --prod --dir site --site "$NETLIFY_SITE_ID" --no-build

      - name: Verify published update
        env:
          UPDATE_BASE_URL: ${{ secrets.ANDROID_UPDATE_URL }}
          RELEASE_CODE: ${{ steps.release_version.outputs.code }}
        run: |
          apk_sha="$(sha256sum "site/vpsdesk-$RELEASE_CODE.apk" | cut -d ' ' -f1)"
          for attempt in 1 2 3 4 5; do
            if python3 Scripts/android_release_version.py verify \
              --manifest "${UPDATE_BASE_URL%/}/version.json" --code "$RELEASE_CODE" --sha256 "$apk_sha"; then
              exit 0
            fi
            echo "Comprobación $attempt fallida; esperando propagación del canal."
            sleep 10
          done
          exit 1
